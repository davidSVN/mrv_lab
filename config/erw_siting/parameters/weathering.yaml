# Parameter registry (F4). Schema: src/mrv_lab/erw_siting/registry.py. Never invent values:
# a parameter without a verified source stays status: missing.
# weathering values are recomputed by erw_siting.weathering; analysis.py fails on any mismatch.
group: weathering
description: 'Kinetics of rock dissolution (plan §5.2 step 2). f_diss is computed per cell by erw_siting.weathering.dissolved_fraction:
  min(1, SSA(P80) * WR * M * s/yr * years * Arrhenius(T)); Strefler et al. 2018 Eq. 2. No pH or water
  term; dry months are a flag only (D-52). Ultramafic rate corrected for serpentinization (D-57).'
parameters:
- id: ssa_coef_m2_per_g
  name: Specific surface area coefficient a in SSA = a * P80^b
  value: 69.18
  unit: m2/g
  distribution: null
  range: null
  source:
    citation: Strefler, J., Amann, T., Bauer, N., Kriegler, E. & Hartmann, J. (2018). Potential and costs
      of carbon dioxide removal by enhanced weathering of rocks. Environmental Research Letters 13, 034010
    doi_or_url: doi:10.1088/1748-9326/aaa9c4
    locator: §2, Eq. 2 (SSA = 69.18 x^-1.24; molar masses) and weathering rates at pH 7, 25 °C
  quality: literature
  status: ok
  notes: SSA(x) = 69.18 x^-1.24 (m2/g, x in µm; Strefler SI B fit to natural material, up to 40x the ideal-sphere
    SSA). Checked against the source by erw_siting.weathering.
- id: ssa_exponent
  name: Specific surface area exponent b in SSA = a * P80^b
  value: -1.24
  unit: dimensionless
  distribution: null
  range: null
  source:
    citation: Strefler, J., Amann, T., Bauer, N., Kriegler, E. & Hartmann, J. (2018). Potential and costs
      of carbon dioxide removal by enhanced weathering of rocks. Environmental Research Letters 13, 034010
    doi_or_url: doi:10.1088/1748-9326/aaa9c4
    locator: §2, Eq. 2 (SSA = 69.18 x^-1.24; molar masses) and weathering rates at pH 7, 25 °C
  quality: literature
  status: ok
  notes: See ssa_coef_m2_per_g. Checked against the source by erw_siting.weathering.
- id: log10_wr_basalt_mol_m2_s
  name: Grain-surface weathering rate of basalt, log10
  value: -10.53
  unit: log10(mol/m2/s)
  distribution: null
  range:
  - -12.63
  - -9.55
  source:
    citation: Strefler, J., Amann, T., Bauer, N., Kriegler, E. & Hartmann, J. (2018). Potential and costs
      of carbon dioxide removal by enhanced weathering of rocks. Environmental Research Letters 13, 034010
    doi_or_url: doi:10.1088/1748-9326/aaa9c4
    locator: §2, Eq. 2 (SSA = 69.18 x^-1.24; molar masses) and weathering rates at pH 7, 25 °C
  quality: literature
  status: ok
  notes: 'At pH 7 and 25 °C; range spans three orders of magnitude (Strefler: +-1 sigma of the Bandstra
    & Brantley fits). Lab-based: abiotic field rates may be ~2 orders lower. Most uncertain term of the
    analysis. Gabbro uses this value (proxy, D-52). Checked against the source by erw_siting.weathering.'
- id: log10_wr_ultramafic_mol_m2_s
  name: Grain-surface weathering rate of ultramafic rock (dunite), log10
  value: -9.86
  unit: log10(mol/m2/s)
  distribution: null
  range:
  - -9.95
  - -9.77
  source:
    citation: Strefler, J., Amann, T., Bauer, N., Kriegler, E. & Hartmann, J. (2018). Potential and costs
      of carbon dioxide removal by enhanced weathering of rocks. Environmental Research Letters 13, 034010
    doi_or_url: doi:10.1088/1748-9326/aaa9c4
    locator: §2, Eq. 2 (SSA = 69.18 x^-1.24; molar masses) and weathering rates at pH 7, 25 °C
  quality: literature
  status: ok
  notes: 'Strefler value for fresh dunite (forsterite) at pH 7 and 25 °C. Pilot ultramafics are partly
    serpentinized: the rate used is mixed with serpentine via serpentinized_fraction_ultramafic and log10_rate_ratio_serpentine_forsterite
    (D-57). Checked against the source by erw_siting.weathering.'
- id: molar_mass_basalt_g_per_mol
  name: Molar mass of basalt
  value: 125.0
  unit: g/mol
  distribution: null
  range: null
  source:
    citation: Strefler, J., Amann, T., Bauer, N., Kriegler, E. & Hartmann, J. (2018). Potential and costs
      of carbon dioxide removal by enhanced weathering of rocks. Environmental Research Letters 13, 034010
    doi_or_url: doi:10.1088/1748-9326/aaa9c4
    locator: §2, Eq. 2 (SSA = 69.18 x^-1.24; molar masses) and weathering rates at pH 7, 25 °C
  quality: literature
  status: ok
  notes: As used by Strefler Eq. 2. Checked against the source by erw_siting.weathering.
- id: molar_mass_ultramafic_g_per_mol
