- id: log10_rate_ratio_serpentine_forsterite
  name: Serpentine rate relative to forsterite, log10
  value: -1.76
  unit: log10(ratio)
  distribution: null
  range:
  - -1.76
  - -1.36
  source:
    citation: Palandri, J.L. & Kharaka, Y.K. (2004). A compilation of rate parameters of water-mineral
      interaction kinetics for application to geochemical modeling. U.S. Geological Survey Open-File Report
      2004-1068
    doi_or_url: doi:10.3133/ofr20041068
    locator: 'Rate-parameter tables: neutral-mechanism activation energy E (kJ/mol)'
  quality: literature
  status: ok
  notes: 'Neutral mechanism at 25 °C: lizardite -12.40 minus forsterite -10.64 = -1.76 (58x slower); range
    up to chrysotile -12.00 (-1.36, 23x slower). Lizardite used (conservative). D-57.'
- id: serpentinized_fraction_ultramafic
  name: Share of ultramafic rock turned to serpentine
  value: 0.7
  unit: fraction
  distribution: null
  range:
  - 0.56
  - 0.79
  source:
    citation: 'Garcia-Casco, A. et al. (2020). The petrologic nature of the ''Medellin Dunite'' revisited.
      In: The Geology of Colombia, Volume 2 Mesozoic. Servicio Geologico Colombiano, Publicaciones Geologicas
      Especiales 36'
    doi_or_url: doi:10.32685/pub.esp.36.2019.02
    locator: '§2: ''a fully serpentinized peridotite yields ca. 12-13 wt % H2O''; Table 1 LOI'
  quality: literature
  status: ok
  notes: Median of LOI / 12.5 wt% over the 49 Medellín samples (fully serpentinized peridotite holds ca.
    12-13 wt% H2O); range = inter-quartile range. LOI includes some CO2 in carbonated samples, so the
    share is slightly high (conservative). Medellín (Antioquia), not the pilot ultramafics. D-57.
