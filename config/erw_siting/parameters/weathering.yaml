- id: activation_energy_kj_per_mol_ultramafic
  name: Activation energy of ultramafic rock dissolution
  value: 79.0
  unit: kJ/mol
  distribution: null
  range: null
  source:
    citation: Palandri, J.L. & Kharaka, Y.K. (2004). A compilation of rate parameters of water-mineral
      interaction kinetics for application to geochemical modeling. U.S. Geological Survey Open-File Report
      2004-1068
    doi_or_url: doi:10.3133/ofr20041068
    locator: 'Rate-parameter tables: neutral-mechanism activation energy E (kJ/mol)'
  quality: literature
  status: ok
  notes: Forsterite, neutral mechanism. Checked against the source by erw_siting.weathering.
- id: reference_temperature_c
  name: Temperature at which WR is given
  value: 25.0
  unit: degC
  distribution: null
  range: null
  source:
    citation: Strefler, J., Amann, T., Bauer, N., Kriegler, E. & Hartmann, J. (2018). Potential and costs
      of carbon dioxide removal by enhanced weathering of rocks. Environmental Research Letters 13, 034010
    doi_or_url: doi:10.1088/1748-9326/aaa9c4
    locator: §2, Eq. 2 (SSA = 69.18 x^-1.24; molar masses) and weathering rates at pH 7, 25 °C
  quality: definition
  status: ok
