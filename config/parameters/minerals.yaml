# Mineral kinetic parameters — Palandri & Kharaka (2004)
# Source: USGS Open-File Report 2004-1068
# URL: https://pubs.usgs.gov/of/2004/1068/
# These are the RATE CONSTANTS used in the TST dissolution rate law.
# All values have status: ok — primary source is the P&K 2004 report.
# Unit for k25: mol/m^2/s; for Ea: kJ/mol

# TST rate law (module §5.3):
#   r = S_A * (k_acid * [H+]^n_H * exp(-Ea_acid/RT) +
#               k_neut * exp(-Ea_neut/RT) +
#               k_base * [OH-]^n_OH * exp(-Ea_base/RT)) * (1 - Omega)

- id: plagioclase_k25_acid
  name: Plagioclase — acid mechanism k25
  symbol: "k_acid_plag"
  group: minerals
  applies_to: [feedstock, geochem]
  value: 1.0e-10   # representative anorthite endmember; albite lower
  unit: "mol/m^2/s"
  range_min: 1.0e-12
  range_max: 1.0e-8
  kind: fixed
  source:
    type: paper
    citation: "Palandri, J.L. & Kharaka, Y.K. (2004) USGS OFR 2004-1068, Table 1"
    doi_or_url: "https://pubs.usgs.gov/of/2004/1068/"
    locator: "Table 1, anorthite / albite"
  quality: primary
  status: ok
  notes: "Range covers albite (slower) to anorthite (faster). Actual composition from XRD — status: missing."

