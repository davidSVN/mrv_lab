[project]
name = "mrv-lab"
version = "0.1.0"
description = "Public, reproducible analyses of carbon MRV data (CDR markets, uncertainty, soil sampling, LCA, CBAM)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "jupytext>=1.16",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "rasterio>=1.4",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
    "PD",  # pandas-vet
]

[tool.ruff.lint.per-file-ignores]
# jupytext cells may import after markdown cells.
"analyses/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
